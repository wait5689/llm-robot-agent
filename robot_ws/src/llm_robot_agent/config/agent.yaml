# =========================================================
# Agent 运行时配置
# =========================================================

llm:
  # 优先从环境变量 DEEPSEEK_API_KEY 读取；也可直接写在这里（不推荐提交到仓库）
  api_key_env: DEEPSEEK_API_KEY
  # base_url / model 留空 = 由环境变量 DEEPSEEK_BASE_URL / DEEPSEEK_MODEL 决定。
  # 只有在需要「配置文件强制覆盖 .env」时才在这里填写，否则会掩盖 .env 的配置。
  base_url:
  model:
  temperature: 0.1
  timeout_sec: 60
  max_retries: 2

agent:
  # 单次任务允许的最大「思考-行动」轮数，防止死循环烧钱
  max_turns: 20
  # 同一地点最多尝试导航次数
  max_nav_attempts: 3
  # 任务总超时（秒）
  task_timeout_sec: 600
  # 每一步之间保持的最小间隔，避免打断导航
  loop_delay_sec: 0.5
  # 工具禁用名单（借鉴 NASA JPL ROSA 的 blacklist 机制）
  #
  # 被禁用的工具会从「给模型看的 schema」里直接移除，而不是只在
  # 调用时拒绝 —— 因为模型只要看得见就会一直尝试，白白消耗轮次。
  #
  # 为什么放在配置里而不是写死在代码：同一套代码，演示时要锁住移动、
  # 真机上要锁住急停，这是部署策略而不是代码逻辑。
  #
  # 格式：工具名 -> 禁用原因（原因会写进模型收到的提示里）
  # 留空表示不禁用任何工具。
  disabled_tools: {}
    # cancel_navigation: 急停类操作需人工确认
    # report_done: 演示期间禁止模型自行宣布结束
  # 以下为可选的停滞检测参数（对应 RosBackend 构造参数）
  # stagnation_timeout_sec: 25.0   # 连续多久没推进判定为受阻
  # stagnation_dist_m: 0.10        # 位移超过多少算「有推进」

navigation:
  # 单次导航目标超时（秒）
  nav_timeout_sec: 120
  # 判定到达的位置误差容限（米）
  goal_tolerance: 0.30
  # 导航失败后允许的最大恢复次数
  max_recovery_attempts: 2
  # 连续失败达到该次数时，判定为「环境级故障」，交由 LLM 决策是否放弃
  consecutive_failure_limit: 3

memory:
  # 任务历史保留条数
  history_size: 50
  # 会话摘要文件（相对 package 目录）
  summary_file: logs/session_memory.json

logging:
  level: INFO
  file: logs/agent.log
