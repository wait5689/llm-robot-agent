# =========================================================
# 语义地图：地点名称 -> 地图坐标系下的目标位姿
# ---------------------------------------------------------
# 这是 Agent 与导航栈之间的关键接口。
# LLM 只会输出语义地点名（例如 "room_a"），坐标映射在这里完成，
# 避免让大模型去编造精确数字坐标。
#
# 【坐标系】全部为 map 坐标系（= Gazebo world 坐标系，原点在场地中心），
# 单位米，yaw 为弧度（0 = 朝向 +X 轴）。
#
# 【场地布局 v3】12 x 10 m，外墙 x∈[-6,6] y∈[-5,5]。
#   南/北由 y=0 的主分隔墙分开，墙上有 3 个门洞，中心
#   x = -3.8 / 0.0 / +3.8，净宽 1.60 m。
#   北区再分为三间：room_a (x<-2.8)、room_c (-2.8~2.8)、room_b (x>2.8)。
#   南区有一道隔墙 x=-2.0（留门），隔出 room_d（西南）。
#
# 【重要】坐标必须与新世界布局一致。世界文件由 tools/gen_world.py
# 生成，改动布局后必须同步本文件，并用下面这条命令校验
# （退出码 0 才算通过）：
#
#   python3 tools/audit_world.py \
#       --world worlds/complex_indoor.world \
#       --locations config/locations.yaml \
#       --start 0.00,-3.40
#
# 历史教训（改坐标前务必读一遍）：
#   * room_c 曾写 (0, 5.0) —— y=5.0 正是北墙的位置，目标在墙体内。
#   * hall 曾写 (3.00,-1.20) —— 正好压在 1.6x0.6m 的前台桌体里。
#   * home 曾写 (0.80,-3.60) —— 压在半径 0.30m 的充电桩本体上，
#     而它同时是 A* 起点与 Gazebo 生成位姿，
#     结果是「所有地点都不可达」+ 机器人被刷进桩体。
#   * room_c 曾写 (0, 2.15) —— 落在北区家具与墙之间，实测为占据格。
#   结论：任何坐标改动都必须跑 audit_world.py，不能靠看图估。
# =========================================================

frame_id: map

# 机器人每次任务开始时的默认点位（南区中央）
#
# 【必须同步】本值必须与下面三处完全一致，否则 Gazebo 会把机器人
# 刷进障碍里，AMCL 初始位姿从第 0 秒就是错的：
#   - launch/gazebo.launch     的 x / y
#   - launch/navigation.launch 的 x / y
#   - launch/navigation.launch 的 init_pose_x / init_pose_y
#
# v3 实测：该点 clearance > 2.5m（四面皆空），是南区的中心空地。
home:
  position: [0.00, -3.40]
  yaw: 1.5708
  description: "起点 / 南区中央空地"

locations:
  # ---- 北区：三个房间 ----
  room_a:
    # 净空 1.36。y=1.80 正对 x=-2.8 墙门洞最宽处（可用 y∈[1.25,2.35]），
    # 出房即入通道，无需先南绕。原 (-3.84,2.54) 净空仅 0.93 且偏北。
    position: [-3.90, 1.80]
    yaw: 1.5708
    description: "房间 A，西北，有办公桌与书柜"

  room_c:
    # 净空 2.28（全场最宽敞）。x=0 正对 y=0 中门可用段 x∈[-0.55,0.55]，
    # y 从 2.60 降到 2.20 以缩短出房距离。
    position: [0.00, 2.20]
    yaw: 1.5708
    description: "房间 C，正北，有货架与储物箱"

  room_b:
    # 净空 1.14。靠近房间西南角，穿 x=+2.8 墙后立即可达。
    # 原 (4.33,1.45) 净空仅 0.93，偏紧。
    position: [4.45, 1.20]
    yaw: 0.0
    description: "房间 B，东北，有沙发与茶几"

  # ---- 南区 ----
  room_d:
    # 净空 1.34。比原 (-4.00,-2.60) 更靠近 x=-2.0 隔墙上的出房门。
    position: [-3.65, -2.45]
    yaw: 0.0
    description: "房间 D，西南，有床与书桌"

  corridor:
    # 中央走廊：主分隔墙 y=0 南侧的空地，正对 x=0 门洞。
    position: [0.00, -1.20]
    yaw: 1.5708
    description: "中央走廊，正对北区门洞"

  hall:
    # 净空 1.76，位于大厅南半部空地。
    # 原 (3.89,-1.40) 净空仅 0.91（贴着前台桌），是导航失败的高发点。
    position: [3.35, -3.10]
    yaw: 3.1416
    description: "南区大厅东南空地"

# 别名表：允许用户用中文/口语化说法指代地点
aliases:
  a: room_a
  房间a: room_a
  房间A: room_a
  A房间: room_a
  b: room_b
  房间b: room_b
  房间B: room_b
  c: room_c
  房间c: room_c
  房间C: room_c
  d: room_d
  房间d: room_d
  房间D: room_d
  起点: home
  出发点: home
  大本营: home
  充电桩: home
  走廊: corridor
  大厅: hall

# =========================================================
# 【净空下限 —— 改坐标前必读】
# ---------------------------------------------------------
# 每个地点周围必须留出足够净空，否则 DWA 会「原地僵死」：
# 持续以 15Hz 发布 cmd_vel，但线速度与角速度恒为 0，
# 目标永不结束（state 一直 ACTIVE），日志里没有任何报错。
#
# 阈值推算：
#   inflation_radius      0.35 m
#   footprint 外接半径    0.362 m  (= hypot(0.28,0.23))
#   ------------------------------------------
#   机器人中心到障碍的最小距离 ≈ 0.71 m
#
# 低于这个值时，机器人自身的 footprint 角点就会落在膨胀层的高代价区，
# DWA 认为所有前向采样轨迹都会碰撞，于是选「不动」。
# 这个故障没有日志，只能靠观察 cmd_vel 恒零来识别。
#
# 实测（v3 世界）：
#   room_a 净空 0.71 -> 边缘，偶发失败
#   room_b 净空 0.83 -> 偶发失败
#   hall   净空 0.80 -> 偶发失败
#   corridor 1.44 / room_c 1.92 / home 1.51 / room_d 1.00 -> 稳定
#
# 结论：新地点请保证 >= 0.95 m 净空。
# 用 tools/audit_world.py 的 clearance 检查，或直接跑
#   python3 tools/check_locations.py
# =========================================================
