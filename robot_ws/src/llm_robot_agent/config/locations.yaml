# =========================================================
# 语义地图：地点名称 -> 地图坐标系下的目标位姿
# ---------------------------------------------------------
# 这是 Agent 与导航栈之间的关键接口。
# LLM 只会输出语义地点名（例如 "room_a"），坐标映射在这里完成，
# 避免让大模型去编造精确数字坐标。
#
# 【坐标系】全部为 map 坐标系（= Gazebo world 坐标系，原点在场地中心），
# 单位米，yaw 为弧度（0 = 朝向 +X 轴，+Y 为北）。
#
# 【场地布局】12 x 10 m，外墙 x∈[-6,6] y∈[-5,5]。
#   南/北由 y=0 的主分隔墙分开，墙上有 3 个门洞，
#   中心 x = -3.8 / 0 / +3.8，净宽 1.90 m。
#   北区由 x=±2.8 两道隔墙分为 room_a / room_c / room_b，
#   每道隔墙各开一个门洞（可用 y≈1.20~1.60）。
#   南区由 x=-2.0 隔墙分出 room_d（西南），东侧是 hall，中央是 home/corridor。
#
# 【本文件全部坐标的来历】
#   针对「当前 tools/gen_world.py 生成的那一份 world」，
#   用 tools/check_locations.py 的 Geometry 逐点扫描得到。
#   验收命令（退出码 0 才算通过）：
#     python3 tools/check_locations.py
#
# ---------------------------------------------------------
# 【血泪教训 —— 改任何东西之前务必读完】
#
# 1) ★ world 文件必须由 tools/gen_world.py 生成，且生成后必须重建地图。
#    本项目出现过一次最隐蔽的故障：gen_world.py 里 DOOR_W 已从 1.10
#    改成 1.90、门中心已从 ±4.0 改成 ±3.8，但仓库里提交的
#    worlds/complex_indoor.world 还是旧参数生成的，从未重新生成过
#    （两份文件差 5873 行）。于是「三个门洞」看起来都在、位置也合理，
#    实际净宽只有 1.10m，扣掉两侧膨胀 0.35 后留给机器人中心的空间
#    只剩 0.37~0.40m，一进门口就开始振荡中止。
#    症状：房间内的目标可以单独到达，但「从一个房间去另一个房间」
#          必然在中途失败，而且日志里没有任何报错。
#    所以改完 gen_world.py 一定要：
#      python3 tools/gen_world.py --out worlds/complex_indoor.world
#      python3 tools/build_map.py --world worlds/complex_indoor.world \
#                                 --out maps/indoor
#    并把两个产物一起提交。地图是离线栅格（不是 SLAM 产物），
#    世界一变就必须重算，否则代价地图与真实几何不一致。
#
# 2) ★ 家具换了位置，所有坐标都要重选。
#    重新生成 world 后，家具整体挪动，原本「净空 1.10」的点
#    可能变成「净空 0.16」（实测 hall 就是这样，
#    因为 reception_desk_top 挪到了那个位置）。
#    所以 world 与 locations.yaml 必须成对更新。
#
# 3) ★ 净空数字只能来自 check_locations.Geometry.clearance()。
#    曾经用自写脚本选点，打印格式串与参数没对齐，
#    把内部排序用的 score（= clearance - 0.30*距锚点距离）
#    当成净空打印出来，于是 corridor/hall 被按 1.76m 写进本文件，
#    实际只有 0.12 / 0.25m —— 到点即僵死。
#    教训：验收数字与搜索打分的数字必须分开，不能共用同一行打印。
#
# 4) 判断门够不够宽，不能只看门洞尺寸，要看
#    「门洞中心线 + 两侧各 0.5m」那段的最窄净空。
#
# 5) 家具不得遮挡任何门洞正前方 1.0m 的出入区域。
#    曾经 crate_c_corner 与 tvstand_b 分别从两侧把 x=+2.8 的门洞
#    夹到净空 0.398m，而那是 room_b 唯一的出口 ——
#    「去 room_b」能成功，「从 room_b 出发」必然失败。
# =========================================================

frame_id: map

# 机器人每次任务开始时的默认点位（南区中央）
#
# 【必须同步】本值必须与下面三处完全一致，否则 Gazebo 会把机器人
# 刷进障碍里，AMCL 初始位姿从第 0 秒就是错的：
#   - launch/gazebo.launch     的 x / y
#   - launch/navigation.launch 的 x / y
#   - launch/navigation.launch 的 init_pose_x / init_pose_y
#
# 南区中央起始空地，净空 2.355（全场最宽，四面皆空）。
#   这是每次任务的起点：既是 A* 的起始格，也是 Gazebo 的生成位姿，
#   必须保证机器人一生成就落在自由空间中央。
home:
  position: [0.30, -2.55]
  yaw: 1.5708
  description: "起点 / 南区中央空地"

locations:
  # ---- 北区：三个房间 ----
  room_a:
    # 北区西北房间内，净空 1.363。
    #     出房经 x=-2.8 隔墙门洞（可用 y≈1.20~1.60），朝东出门。
    position: [-3.90, 1.80]
    yaw: 0.0000
    description: "房间 A，西北，有办公桌与书柜"

  room_c:
    # 北区正中房间内，净空 2.297（全场最宽）。
    #     正对 y=0 中门洞（可用 x≈-0.95~0.95），朝南出门即达 corridor。
    position: [0.00, 2.20]
    yaw: -1.5708
    description: "房间 C，正北，有货架与储物箱"

  room_b:
    # 北区东北房间内，净空 1.150。
    #     room_b 的唯一出口是 x=+2.8 隔墙门洞（可用 y≈1.20~1.60），
    #     本点就在门洞东北侧，朝西出门。
    position: [3.85, 1.55]
    yaw: 3.1416
    description: "房间 B，东北，有沙发与茶几"

  # ---- 南区：走廊与大厅 ----
  room_d:
    # 南区西侧房间内，净空 1.336。
    #     出房经 x=-2.0 隔墙门洞（可用 y≈-2.65~-2.35），朝东出门。
    position: [-3.65, -2.45]
    yaw: 0.0000
    description: "房间 D，西南，有床与书桌"

  corridor:
    # 主分隔墙 y=0 正南侧，净空 1.983。
    #     正对 y=0 中门洞下方，朝北面朝门洞，
    #     是南北往来与东西横穿的枢纽点。
    position: [0.10, -1.90]
    yaw: 1.5708
    description: "中央走廊，主分隔墙南侧"

  hall:
    # 南区东侧大厅，净空 1.763。
    #     远离 pillar_2 / box_south / reception_desk 等家具。
    position: [3.35, -3.10]
    yaw: 3.1416
    description: "南区大厅东侧"


# 别名表：允许用户用中文/口语化说法指代地点
aliases:
  a: room_a
  房间a: room_a
  房间A: room_a
  A房间: room_a
  b: room_b
  房间b: room_b
  房间B: room_b
  c: room_c
  房间c: room_c
  房间C: room_c
  d: room_d
  房间d: room_d
  房间D: room_d
  起点: home
  出发点: home
  大本营: home
  充电桩: home
  走廊: corridor
  大厅: hall

# =========================================================
# 【净空下限 —— 改坐标前必读】
# ---------------------------------------------------------
# 每个地点周围必须留出足够净空，否则规划器会「原地僵死」：
# 持续以 15Hz 发布 cmd_vel，但线速度与角速度恒为 0，
# 目标永不结束（state 一直 ACTIVE），日志里没有任何报错。
#
# 阈值推算：
#   inflation_radius      0.35 m
#   footprint 外接半径    0.362 m  (= hypot(0.28,0.23))
#   ------------------------------------------
#   机器人中心到障碍的最小距离 ≈ 0.71 m
#
# 当前 7 个点的实测净空（check_locations.py 输出）：
#   home     2.355      room_c   2.297
#   corridor 1.983      hall     1.763
#   room_a   1.363      room_d   1.336
#   room_b   1.150
#   全部 >= 1.15，两两双向可达 21/21。
#
# 门洞实测净空（门宽 1.90，扣膨胀后中心可活动带宽约 1.20m）：
#   y=0  三门 x=-3.8/0/+3.8 : 0.905 ~ 0.920
#   北区隔墙 x=±2.8         : 0.920
#   南区隔墙 x=-2.0         : 0.920
#
# 唯一权威的检查方式：
#   python3 tools/check_locations.py
# =========================================================
