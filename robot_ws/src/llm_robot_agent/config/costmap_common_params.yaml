# 代价地图公共参数（local 与 global 共享）
# 机器人几何：需与 urdf/advanced_robot.urdf 中 base_link 尺寸一致
footprint: [[-0.25, -0.20], [-0.25, 0.20], [0.25, 0.20], [0.25, -0.20]]

inflation_radius: 0.45
cost_scaling_factor: 3.0

obstacle_layer:
  enabled: true
  combination_method: 1
  track_unknown_space: true
  obstacle_range: 3.0
  raytrace_range: 3.5
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    max_obstacle_height: 2.0
    min_obstacle_height: 0.0

static_layer:
  enabled: true

inflation_layer:
  enabled: true
