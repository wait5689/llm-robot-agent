# =========================================================
# DWA 局部规划器（base_local_planner/TrajectoryPlannerROS）
# ---------------------------------------------------------
# 参数依据 urdf/advanced_robot.urdf 中的差速驱动设定：
#   wheelSeparation 0.40 m、wheelDiameter 0.16 m、wheelTorque 30
# 室内速度取保守值：0.30 m/s 已足够，撞墙后果更轻。
# =========================================================

TrajectoryPlannerROS:
  # 线速度
  max_vel_x: 0.30
  # min_vel_x 必须为 0：DWA 一旦允许倒车，
  # 在门口容易后退撞墙并持续打滑，里程计随之虚增，AMCL 直接跟丢。
  min_vel_x: 0.0
  max_vel_theta: 1.0
  min_in_place_vel_theta: 0.35

  # 加速度限制：过大容易在窄门洞处冲过头
  acc_lim_x: 0.8
  acc_lim_theta: 1.5

  # 到达判定。必须与 config/agent.yaml 的 navigation.goal_tolerance 协调：
  # agent 侧 0.30 m，这里取 0.20 m 更严格，
  # 保证 move_base 报 SUCCEEDED 时 agent 的到达判定也一定成立。
  # ★ latch_xy_goal_tolerance 必须保持 false（这也正是上游默认值）。
  #
  # 这里踩过一个很隐蔽的坑，记下来避免重犯：
  # 曾经为了消除「到达目标后原地画小圈」，把它改成 true，结果更糟 ——
  # 机器人在 room_a（map 位姿 (-3.56,3.01)）接受去 home 的目标后，
  # move_base 持续以 15Hz 发布 cmd_vel，但线速度与角速度恒为 0，
  # 目标永不结束（state 一直 ACTIVE），也不报任何错误。
  # 症状：机器人彻底静止，日志干净，全靠 timeout 才发现。
  #
  # ── 机制更正（对照上游 ros-planning/navigation 源码）──────────
  # trajectory_planner_ros.cpp 里的真实逻辑是：
  #
  #   if (xy_tolerance_latch_ || dist <= xy_goal_tolerance_) {
  #     if (latch_xy_goal_tolerance_) xy_tolerance_latch_ = true;
  #     if (|angle| <= yaw_goal_tolerance_) {
  #         cmd_vel = 0; xy_tolerance_latch_ = false; reached_goal_ = true;
  #     } else { ...原地旋转... }
  #   }
  #
  # 也就是说 latch=true 的**设计意图**是「进入 xy 容差后就只原地转到
  # 目标朝向」；只要 yaw 还没到位就会继续旋转，转到容差内即清 latch
  # 并正常结束。所以「latch=true 必然永久死锁」是过度归因 ——
  # 当时观察到的零速静止，更可能是 yaw 已在容差内、而位姿恰在边界
  # 抖动，使得每周期都落入「不需要平移也不需要旋转」的分支。
  #
  # 但**结论不变**，仍保持 false，因为：
  #   1) false 是上游默认值，行为最可预测；
  #   2) latch 生效后会放弃平移修正，只靠旋转收尾，
  #      在狭窄门口容易停在容差边缘而非真正就位；
  #   3) 换成 false 后该「零速静止」现象没有再复现。
  #
  # 「原地画小圈」另有根治办法：放宽 oscillation 阈值（见 move_base_params.yaml）。
  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.20
  latch_xy_goal_tolerance: false

  # 对准 yaw 的最低角速度。0.35 对 0.20rad 容差偏大，容易过冲反打。
  min_in_place_vel_theta: 0.20

  # 轨迹采样
  # sim_time 保持 1.7。试过 2.0：前瞻变长后 DWA 在 1.6m 门洞前
  # 更倾向选「减速绕行」而不是「直接穿过」，反而在门口犹豫不决。
  sim_time: 1.7
  sim_granularity: 0.025
  vx_samples: 20
  vtheta_samples: 40
  controller_frequency: 15.0

  # 评分权重：提高 path/heading 权重让走道更居中，减少贴墙
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  # occdist_scale 必须保持很小。它是「离障碍多近就扣分」的权重，
  # 试过 0.05：在 1.6m 门洞里，两侧膨胀层同时产生代价，
  # DWA 认为所有轨迹都危险，于是原地不动等恢复行为。
  # 0.02 让规划器优先跟随全局路径，穿门更果断。
  occdist_scale: 0.02

  # 差速机器人
  holonomic_robot: false
  meter_scoring: true

  # 震荡抑制：来回摆动超过阈值就交给 move_base 的恢复行为
  # 从 0.10 放宽到 0.20：房间里横向空间只有 ~0.5m，
  # 0.10m 的复位阈值会让 DWA 频繁重置轨迹，加剧摆动；
  # 但放太宽（试过 0.30）会让「确实卡住」的情况迟迟不触发恢复。
  oscillation_reset_dist: 0.20
