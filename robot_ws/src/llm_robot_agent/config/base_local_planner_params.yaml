# DWA 局部规划器：负责避障与速度平滑
TrajectoryPlannerROS:
  max_vel_x: 0.35
  min_vel_x: 0.0
  max_vel_theta: 1.0
  min_in_place_vel_theta: 0.4
  acc_lim_x: 1.0
  acc_lim_theta: 2.0

  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: false

  sim_time: 1.7
  vx_samples: 20
  vtheta_samples: 40
  controller_frequency: 15.0

  holonomic_robot: false
  meter_scoring: true
