<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Robot Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .status-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .status-item label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .status-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .result-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #28a745;
        }
        
        .result-item.error {
            border-left-color: #dc3545;
        }
        
        .result-item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .result-item p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .quick-commands {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .quick-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 LLM Robot Agent</h1>
        
        <!-- 控制面板 -->
        <div class="panel">
            <h2>控制面板</h2>
            <div class="input-group">
                <input type="text" id="commandInput" placeholder="输入指令，例如：前进 1 米，然后左转 90 度" />
                <button onclick="executeCommand()" id="executeBtn">执行</button>
            </div>
            <div class="quick-commands">
                <span class="quick-btn" onclick="quickCommand('前进 1 米')">前进 1 米</span>
                <span class="quick-btn" onclick="quickCommand('左转 90 度')">左转 90 度</span>
                <span class="quick-btn" onclick="quickCommand('我的位置在哪')">查看位置</span>
                <span class="quick-btn" onclick="quickCommand('停止')">停止</span>
            </div>
        </div>
        
        <!-- 状态面板 -->
        <div class="panel">
            <h2>机器人状态</h2>
            <div class="status-grid">
                <div class="status-item">
                    <label>X 坐标</label>
                    <div class="value" id="posX">0.000</div>
                </div>
                <div class="status-item">
                    <label>Y 坐标</label>
                    <div class="value" id="posY">0.000</div>
                </div>
                <div class="status-item">
                    <label>角度</label>
                    <div class="value" id="posTheta">0.000</div>
                </div>
            </div>
        </div>
        
        <!-- 执行结果 -->
        <div class="panel">
            <h2>执行结果</h2>
            <div id="resultBox" class="result-box">
                <p style="color: #999; text-align: center;">暂无执行记录</p>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时获取状态
        window.onload = function() {
            updateStatus();
            setInterval(updateStatus, 2000); // 每 2 秒更新一次状态
        };
        
        // 回车键执行
        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executeCommand();
            }
        });
        
        // 快速指令
        function quickCommand(cmd) {
            document.getElementById('commandInput').value = cmd;
            executeCommand();
        }
        
        // 执行指令
        async function executeCommand() {
            const input = document.getElementById('commandInput');
            const command = input.value.trim();
            
            if (!command) {
                alert('请输入指令');
                return;
            }
            
            const btn = document.getElementById('executeBtn');
            const resultBox = document.getElementById('resultBox');
            
            // 显示加载状态
            btn.disabled = true;
            resultBox.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在执行...</p></div>';
            
            try {
                const response = await fetch('/api/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: command })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data);
                    input.value = ''; // 清空输入
                } else {
                    resultBox.innerHTML = `<div class="result-item error"><h3>执行失败</h3><p>${data.error}</p></div>`;
                }
            } catch (error) {
                resultBox.innerHTML = `<div class="result-item error"><h3>请求失败</h3><p>${error.message}</p></div>`;
            } finally {
                btn.disabled = false;
            }
        }
        
        // 显示结果
        function displayResults(data) {
            const resultBox = document.getElementById('resultBox');
            let html = `<div class="result-item"><h3>指令: ${data.command}</h3>`;
            html += `<p>任务步骤: ${data.task_steps.length} 步</p>`;
            
            data.results.forEach((result, index) => {
                const status = result.result.success ? '✓' : '✗';
                const statusClass = result.result.success ? '' : 'error';
                html += `<div class="result-item ${statusClass}">`;
                html += `<h3>步骤 ${index + 1}: ${result.tool} ${status}</h3>`;
                html += `<p>参数: ${JSON.stringify(result.params)}</p>`;
                html += `<p>结果: ${result.result.message || JSON.stringify(result.result)}</p>`;
                html += `</div>`;
            });
            
            html += `<p><strong>最终位置:</strong> X=${data.final_position.x}, Y=${data.final_position.y}, θ=${data.final_position.theta}</p>`;
            html += `</div>`;
            
            resultBox.innerHTML = html;
        }
        
        // 更新状态
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('posX').textContent = data.position.x.toFixed(3);
                    document.getElementById('posY').textContent = data.position.y.toFixed(3);
                    document.getElementById('posTheta').textContent = data.position.theta.toFixed(3);
                }
            } catch (error) {
                console.error('更新状态失败:', error);
            }
        }
    </script>
</body>
</html>
